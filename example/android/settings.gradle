pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Built-in Kotlin drives the Kotlin compiler through whatever KGP version AGP
// itself depends on — 2.2.10 for AGP 9.1.1, which is below the 2.2.20 minimum the
// Flutter Gradle plugin enforces (and below the 2.3.20 it warns about). There is no
// AGP DSL for this, so pin it on the settings classpath that Built-in Kotlin
// resolves from. Keep in step with stripe_android's ext.kotlin_version, which the
// Compose compiler plugin is resolved against.
buildscript {
    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.jetbrains.kotlin") {
                details.useVersion "2.4.10"
            }
        }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.1.1" apply false
    // The Kotlin Gradle Plugin is intentionally not declared: this build uses
    // AGP's Built-in Kotlin (android.builtInKotlin=true in gradle.properties).
}

include ":app"
