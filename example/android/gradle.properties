org.gradle.jvmargs=-Xmx4g -Xms1g
android.useAndroidX=true
# Jetifier is not needed (no support-library dependencies left) and its transform
# rewrites every jar on the classpath, which exhausts the Gradle heap under AGP 9.
# Built-in Kotlin (AGP 9+). Kotlin is compiled by AGP itself, so neither this app
# nor the Flutter plugins it depends on may apply the Kotlin Gradle Plugin.
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
