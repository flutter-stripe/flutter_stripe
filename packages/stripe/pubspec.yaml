name: flutter_stripe
description: Flutter library for Stripe. Supports PaymentSheets, Apple & Google Pay, SCA, PSD2 and much more.
version: 15.0.0-dev.1
homepage: https://github.com/flutter-stripe/flutter_stripe
repository: https://github.com/flutter-stripe/flutter_stripe

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.47.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: stripe_android
      ios:
        default_package: stripe_ios
      web:
        default_package: stripe_web

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.6.0
  meta: ^1.8.0
  stripe_android: ^15.0.0-dev.1
  stripe_ios: ^15.0.0-dev.1
  stripe_platform_interface: ^15.0.0-dev.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
