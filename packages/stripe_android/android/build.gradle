group 'com.flutter.stripe'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    ext.stripe_version = '23.12.0'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        // The external Kotlin Gradle Plugin is only applied on AGP < 9 (Flutter < 3.44).
        // On AGP >= 9 Flutter's built-in Kotlin provides it (see the conditional apply below).
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: "org.jetbrains.kotlin.plugin.compose"

// Apply the external Kotlin Gradle Plugin only on AGP < 9 (Flutter < 3.44).
// On AGP >= 9 (Flutter >= 3.44) Kotlin is applied automatically by Flutter's
// built-in Kotlin support, so applying it here would conflict.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'com.flutter.stripe'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.1'
    }

    if (agpMajor < 9) {
        sourceSets {
            main.java.srcDirs += 'src/main/kotlin'
        }
    }
    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }
    defaultConfig {
        minSdkVersion 21
        consumerProguardFiles 'proguard-rules.txt'
        buildConfigField "String", "STRIPE_ANDROID_SDK_VERSION", "\"$stripe_version\""
        buildConfigField "Boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
    }
}

// On AGP < 9, jvmTarget must be set explicitly via the Kotlin extension.
// On AGP >= 9, built-in Kotlin already derives it from compileOptions.targetCompatibility above.
if (agpMajor < 9) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

dependencies {

    implementation 'com.facebook.fresco:fresco:3.6.0'
    implementation 'com.facebook.fresco:middleware:3.6.0'
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.4.1"
    implementation "com.stripe:stripe-android:$stripe_version"
    implementation "com.stripe:financial-connections:$stripe_version"
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'

    // Jetpack Compose dependencies for EmbeddedPaymentElement
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.activity:activity-compose:1.8.0'

    // play-services-wallet is already included in stripe-android
    compileOnly "com.google.android.gms:play-services-wallet:19.3.0"

    // Users need to declare this dependency on their own, otherwise all methods are a no-op
    compileOnly 'com.stripe:stripe-android-issuing-push-provisioning:1.3.0'
}
