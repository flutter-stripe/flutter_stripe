group 'com.flutter.stripe'
version '1.0-SNAPSHOT'

buildscript {
    // Must stay in step with the Kotlin version the consuming app builds with:
    // under Built-in Kotlin that is the version AGP resolves for KGP, and the
    // Compose compiler plugin has to match the Kotlin compiler it runs in.
    ext.kotlin_version = '2.4.10'
    ext.stripe_version = '23.12.0'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        // KGP is only *applied* on AGP < 9 (see below), but it must stay on the
        // classpath there. The Compose compiler plugin is applied on every AGP
        // version: Built-in Kotlin compiles Compose but does not supply the plugin.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int

// Compose is enabled via buildFeatures below, and AGP requires the Compose compiler
// plugin whenever it is — Built-in Kotlin included. This plugin is not KGP, so it
// applies on every AGP version.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// On AGP >= 9 Kotlin itself is compiled by AGP's Built-in Kotlin, and applying the
// Kotlin Gradle Plugin on top of that is a hard error, so KGP is only applied on
// AGP < 9 (Flutter < 3.44).
//
// It is applied through pluginManager rather than `apply plugin: 'kotlin-android'`
// deliberately: Flutter detects KGP usage by regex-scanning this build script, so
// the literal form would trip its "plugin applies KGP" warning even on AGP 9,
// where the branch below never runs.
if (agpMajor < 9) {
    pluginManager.apply('kotlin-android')
}

android {
    namespace 'com.flutter.stripe'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

    // src/main/kotlin holds the React Native compatibility shims, which are a mix
    // of .kt and .java. Built-in Kotlin would treat the directory as Kotlin-only
    // and the .java files would never reach javac, so register it for Java on
    // every AGP version.
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        consumerProguardFiles 'proguard-rules.txt'
        buildConfigField "String", "STRIPE_ANDROID_SDK_VERSION", "\"$stripe_version\""
        buildConfigField "Boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
    }
}

// On AGP < 9, jvmTarget must be set explicitly via the Kotlin extension.
// On AGP >= 9, built-in Kotlin already derives it from compileOptions.targetCompatibility above.
if (agpMajor < 9) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

dependencies {

    implementation 'com.facebook.fresco:fresco:3.6.0'
    implementation 'com.facebook.fresco:middleware:3.6.0'
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.4.1"
    implementation "com.stripe:stripe-android:$stripe_version"
    implementation "com.stripe:financial-connections:$stripe_version"
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'

    // Jetpack Compose dependencies for EmbeddedPaymentElement
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.activity:activity-compose:1.8.0'

    // play-services-wallet is already included in stripe-android
    compileOnly "com.google.android.gms:play-services-wallet:19.3.0"

    // Users need to declare this dependency on their own, otherwise all methods are a no-op
    compileOnly 'com.stripe:stripe-android-issuing-push-provisioning:1.3.0'
    compileOnly('com.stripe:stripe-android-issuing-push-provisioning:1.3.0') {
        transitive = false
    }
}
